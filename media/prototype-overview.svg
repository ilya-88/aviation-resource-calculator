<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Первый макет приложения Авиаресурс</title>
  <desc id="desc">Три мобильных экрана: самолёты, карточка борта и ввод лётной смены с расчётом земной наработки.</desc>
  <rect width="1500" height="900" fill="#eef3f6"/>
