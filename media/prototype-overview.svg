    <text x="158" y="222" font-family="Segoe UI,Arial" font-size="12" fill="#52677b">ПОСАДКИ</text><text x="158" y="252" font-family="Segoe UI,Arial" font-size="21" font-weight="600" fill="#12263a">386</text>
