    <text x="44" y="534" font-family="Segoe UI,Arial" font-size="13" fill="#b8c4cf">БУДЕТ НАЧИСЛЕНО</text>
    <text x="44" y="570" font-family="Segoe UI,Arial" font-size="24" font-weight="600" fill="#ffffff">1 ч 03 мин</text>
    <text x="44" y="590" font-family="Segoe UI,Arial" font-size="13" fill="#b8c4cf">на каждый двигатель</text>
    <rect x="24" y="618" width="342" height="22" rx="11" fill="#1976d2"/>
