    <text x="126" y="248" font-family="Segoe UI,Arial" font-size="21" font-weight="600" fill="#12263a">Су-33 · борт 85</text>
    <text x="126" y="278" font-family="Segoe UI,Arial" font-size="15" fill="#52677b">Зав. № 49051002905</text>
    <text x="44" y="326" font-family="Segoe UI,Arial" font-size="18" font-weight="600" fill="#12263a">742:18</text>
    <text x="105" y="326" font-family="Segoe UI,Arial" font-size="15" fill="#52677b">налёт</text>
    <text x="190" y="326" font-family="Segoe UI,Arial" font-size="18" font-weight="600" fill="#12263a">386</text>
    <text x="232" y="326" font-family="Segoe UI,Arial" font-size="15" fill="#52677b">посадок</text>
