      <rect x="24" y="335" width="342" height="60" rx="15" fill="#ffffff" stroke="#dce4ea"/><text x="45" y="371" font-size="16" font-weight="600" fill="#12263a">Формуляр самолёта</text>
      <rect x="24" y="407" width="342" height="60" rx="15" fill="#ffffff" stroke="#dce4ea"/><text x="45" y="443" font-size="16" font-weight="600" fill="#12263a">Левый двигатель · АЛ-31Ф</text><circle cx="341" cy="437" r="6" fill="#b46a00"/>
      <rect x="24" y="479" width="342" height="60" rx="15" fill="#ffffff" stroke="#dce4ea"/><text x="45" y="515" font-size="16" font-weight="600" fill="#12263a">Правый двигатель · АЛ-31Ф</text><circle cx="341" cy="509" r="6" fill="#16835a"/>
