    <text x="45" y="440" font-family="Segoe UI,Arial" font-size="15" font-weight="600" fill="#12263a">Ближайшая работа через 3 дня</text>
    <text x="45" y="468" font-family="Segoe UI,Arial" font-size="14" fill="#52677b">ГТДЭ / ВСУ · работа 60 дней</text>
