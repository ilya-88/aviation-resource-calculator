    <text x="28" y="160" font-family="Segoe UI,Arial" font-size="30" font-weight="600" fill="#12263a">Су-33 · борт 85</text>
    <rect x="24" y="190" width="342" height="106" rx="18" fill="#f8fafb" stroke="#dce4ea"/>
    <text x="44" y="222" font-family="Segoe UI,Arial" font-size="16" font-weight="600" fill="#12263a">Полётная наработка</text>
    <text x="44" y="262" font-family="Segoe UI,Arial" font-size="25" font-weight="600" fill="#12263a">1 ч 00 мин</text>
    <rect x="24" y="314" width="342" height="166" rx="18" fill="#ffffff" stroke="#dce4ea"/>
    <text x="44" y="350" font-family="Segoe UI,Arial" font-size="16" font-weight="600" fill="#12263a">Земля · левый двигатель</text>
    <text x="44" y="388" font-family="Segoe UI,Arial" font-size="23" font-weight="600" fill="#12263a">13 мин</text>
